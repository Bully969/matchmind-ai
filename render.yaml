services:
  - type: web
    name: matchmind-ai-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATA_PROVIDER
        value: demo
      - key: AI_PROVIDER
        value: template
      - key: CORS_ORIGINS
        value: https://matchmind-ai-beta.vercel.app
      - key: DATABASE_URL
        value: sqlite:///./data/tipster.db
